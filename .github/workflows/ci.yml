name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Test data, SQL, and API contracts
        run: python -m pytest

  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    name: Container smoke test
    needs: [python, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build release container
        run: docker build --tag presslens:ci .
      - name: Verify the packaged application
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name presslens-ci --read-only --tmpfs /tmp:rw,size=32m --publish 127.0.0.1:8000:8000 presslens:ci
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs presslens-ci
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<html'
          test "$(docker inspect --format '{{.Config.User}}' presslens-ci)" = "10001:10001"
      - name: Container logs
        if: failure()
        run: docker logs presslens-ci || true
      - name: Stop test container
        if: always()
        run: docker rm --force presslens-ci || true
